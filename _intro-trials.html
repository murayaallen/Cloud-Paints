<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Paints — hero intro A</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" onerror="this.remove()">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#08070c;color:#f5f1e8;font:15px/1.5 'Inter',system-ui,sans-serif}
  header{padding:22px 26px 6px}
  h1{font:600 22px/1.2 'Fraunces',Georgia,serif;margin:0 0 6px}
  p.sub{margin:0;color:#9a94ad;font-size:13.5px}
  .bar{padding:12px 26px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:600 13px/1 inherit;color:#fff;background:#1c1a26;border:1px solid #302c40;
         padding:9px 15px;border-radius:100px;cursor:pointer}
  button:hover{border-color:#e11f29}
  button.go{background:linear-gradient(120deg,#e11f29,#8b1e6b);border-color:transparent}
  button.on{border-color:#ffc93d;color:#ffc93d}
  .phase{padding:0 26px 6px;font:800 10px/1 'Inter',sans-serif;letter-spacing:.24em;
         text-transform:uppercase;color:#ffc93d;height:12px}

  .stage{position:relative;margin:6px 26px 30px;height:300px;overflow:hidden;
    background:transparent}
  .floor{display:none}

  /* ---- line-up items: no names, just tins ---- */
  .it{position:absolute;left:50%;bottom:116px;opacity:0;will-change:transform,opacity}
  .it .bk{height:94px;width:auto;display:block;filter:drop-shadow(0 20px 26px rgba(0,0,0,.5))}
  .it .refl{height:94px;width:auto;display:block;transform:scaleY(-1);opacity:.2;
            -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 55%);
            mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 55%)}
  .it .pool{position:absolute;left:50%;bottom:-9px;width:84px;height:18px;
            transform:translateX(-50%) scale(.4);opacity:0;border-radius:50%;
            background:radial-gradient(ellipse,var(--c),transparent 70%);filter:blur(7px)}
  .it .ring{position:absolute;left:50%;bottom:-4px;width:20px;height:8px;margin-left:-10px;
            border:2px solid var(--c);border-radius:50%;opacity:0}

  .sheen{position:absolute;top:0;bottom:0;width:34%;opacity:0;pointer-events:none;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.30) 45%,rgba(255,255,255,.05) 62%,transparent);
    filter:blur(2px)}

  /* ---- slide phase: one product at a time, named ---- */
  .slide{position:absolute;inset:0;opacity:0;pointer-events:none}
  .slide .sbk{position:absolute;left:50%;bottom:110px;height:138px;width:auto;
              transform:translateX(-50%);filter:drop-shadow(0 26px 34px rgba(0,0,0,.55))}
  .slide .spool{position:absolute;left:50%;bottom:100px;width:136px;height:24px;
                transform:translateX(-50%);border-radius:50%;filter:blur(13px);opacity:.6;
                background:radial-gradient(ellipse,var(--c),transparent 70%)}
  .slab{position:absolute;left:0;right:0;bottom:34px;text-align:center}
  .slab em{display:block;font:800 9px/1 'Inter',sans-serif;letter-spacing:.24em;
           text-transform:uppercase;font-style:normal;color:rgba(245,241,232,.6);margin-bottom:9px}
  .slab b{display:block;font:500 26px/1.05 'Fraunces',Georgia,serif;letter-spacing:-.015em}
  .slab i{display:block;height:2px;width:0;margin:10px auto 0;border-radius:3px;background:var(--c)}
</style></head><body>

<header>
  <h1>A — bounce-in line-up, then the named slides</h1>
  <p class="sub">The launch flash carries no names. Names arrive once products come one at a time.</p>
</header>
<div class="bar">
  <button class="go" onclick="playAll()">▶ Replay both</button>
  <button onclick="flash()">Flash only</button>
  <button onclick="slides()">Slides only</button>
  <button id="slowBtn" onclick="toggleSlow()">Slow-mo</button>
  <span id="clock" style="color:#8b849c;font-size:12.5px"></span>
</div>
<div class="phase" id="phase"></div>

<div class="stage" id="stage">
  <div class="floor"></div>
  <div class="sheen" id="sheen"></div>
  <div class="slide" id="slide">
    <div class="spool"></div>
    <img class="sbk" alt="">
    <div class="slab"><em></em><b></b><i></i></div>
  </div>
</div>

<script>
var P = [
 {s:"weatherguard", n:"Weatherguard",          k:"Exterior wall paint",     c:"#d92843"},
 {s:"silk-vinyl",   n:"Silk Vinyl",            k:"Interior wall paint",     c:"#ec4899"},
 {s:"vinyl-matt",   n:"Vinyl Matt",            k:"Interior & exterior",     c:"#3b5bdb"},
 {s:"supermatt",    n:"SuperMatt Emulsion",    k:"Ceilings & walls",        c:"#d92843"},
 {s:"iris-economy", n:"Iris Plastic Emulsion", k:"Interior wall paint",     c:"#fbbf24"},
 {s:"rocketex",     n:"Rocketex Wallmaster",   k:"Textured exterior",       c:"#3b5bdb"},
 {s:"gloss-enamel", n:"Gloss Enamel",          k:"Wood & metal",            c:"#1e3a8a"},
 {s:"super-gloss",  n:"Super Gloss",           k:"Trade gloss enamel",      c:"#3b5bdb"},
 {s:"roof-paint",   n:"Roof Paint",            k:"Roofs & tiles",           c:"#d92843"},
 {s:"road-marking", n:"Road Marking Paint",    k:"Road & line marking",     c:"#4a5568"},
 {s:"clear-varnish",n:"Clear Varnish",         k:"Wood varnish",            c:"#d69e2e"},
 {s:"turpentine",   n:"Turpentine",            k:"Solvent",                 c:"#d1d5db"}
];
var SRC = function (p) { return 'images/buckets/intro/' + p.s + '.webp'; };

var OUT = 'cubic-bezier(.2,.9,.3,1.32)';
var SOFT = 'cubic-bezier(.25,.8,.35,1)';
var FALL = 'cubic-bezier(.5,0,.9,.4)';
var K = 1, GAP = 58;
function ms(v){ return v * K; }
function tx(x){ return 'translateX(calc(-50% + ' + x + 'px))'; }
function phase(t){ document.getElementById('phase').textContent = t || ''; }

var timers = [];
function later(fn, d){ timers.push(setTimeout(fn, d)); }
function reset(){
  timers.forEach(clearTimeout); timers = [];
  document.querySelectorAll('.it').forEach(function(n){ n.remove(); });
  var sl = document.getElementById('slide');
  sl.getAnimations().forEach(function(a){ a.cancel(); });
  sl.querySelectorAll('*').forEach(function(n){ n.getAnimations().forEach(function(a){ a.cancel(); }); });
  sl.style.opacity = 0;
  phase('');
  document.getElementById('clock').textContent = '';
}

// ---------- PHASE 1 — the flash. No names. ----------
function flash(done){
  reset();
  phase('Launch flash — no names');
  var st = document.getElementById('stage');
  var items = P.map(function(p){
    var d = document.createElement('div');
    d.className = 'it'; d.style.setProperty('--c', p.c);
    d.innerHTML = '<div class="pool"></div><div class="ring"></div>' +
      '<img class="bk" src="' + SRC(p) + '" alt="">' +
      '<img class="refl" src="' + SRC(p) + '" alt="" aria-hidden="true">';
    st.appendChild(d);
    return d;
  });

  var n = items.length, x0 = -(n - 1) * GAP / 2;
  items.forEach(function(el, i){
    var x = x0 + i * GAP, delay = ms(i * 50);
    el.animate([
      {transform: tx(x + 460) + ' translateY(-18px) scale(.88) rotate(9deg)', opacity: 0},
      {transform: tx(x) + ' translateY(-20px) scale(1.08) rotate(-2deg)', opacity: 1, offset: .68},
      {transform: tx(x) + ' translateY(0) scale(1) rotate(0deg)', opacity: 1}
    ], {duration: ms(600), delay: delay, easing: OUT, fill: 'both'});
    el.querySelector('.bk').animate([
      {transform:'scale(1,1)'},{transform:'scale(1.1,.88)',offset:.55},
      {transform:'scale(.97,1.04)',offset:.78},{transform:'scale(1,1)'}
    ], {duration: ms(320), delay: delay + ms(430), easing: SOFT, fill: 'both'});
    el.querySelector('.pool').animate([
      {opacity:0,transform:'translateX(-50%) scale(.4)'},
      {opacity:.95,transform:'translateX(-50%) scale(1.15)',offset:.35},
      {opacity:.5,transform:'translateX(-50%) scale(1)'}
    ], {duration: ms(520), delay: delay + ms(420), easing: SOFT, fill: 'both'});
    el.querySelector('.ring').animate([
      {opacity:.85,transform:'scale(.5)'},{opacity:0,transform:'scale(7,3.4)'}
    ], {duration: ms(560), delay: delay + ms(440), easing:'cubic-bezier(.15,.7,.3,1)', fill:'both'});
  });

  var settled = ms((n - 1) * 50 + 600);
  document.getElementById('sheen').animate([
    {transform:'translateX(-40%) skewX(-12deg)',opacity:0},
    {opacity:.9,offset:.35},
    {transform:'translateX(330%) skewX(-12deg)',opacity:0}
  ], {duration: ms(760), delay: settled - ms(60), easing:'cubic-bezier(.3,0,.4,1)', fill:'both'});

  var clearAt = settled + ms(420);
  later(function(){
    phase('Clearing to the hero');
    items.forEach(function(el, i){
      var x = x0 + i * GAP;
      el.animate([
        {transform: tx(x), opacity: 1},
        {transform: tx(x) + ' translateY(150px) scale(.8)', opacity: 0}
      ], {duration: ms(340), delay: ms((n - i) * 15), easing: FALL, fill:'both'});
    });
  }, clearAt);

  var endAt = clearAt + ms(340 + n * 15 + 60);
  later(function(){
    document.querySelectorAll('.it').forEach(function(x){ x.remove(); });
    document.getElementById('clock').textContent =
      'full range at ' + (settled/1000).toFixed(2) + 's, cleared by ' + (endAt/1000).toFixed(2) + 's'
      + (K > 1 ? '  (slow-mo ' + K + 'x)' : '');
    if (done) done();
  }, endAt);
  return endAt;
}

// ---------- PHASE 2 — one at a time, named ----------
function showSlide(p, first){
  var sl = document.getElementById('slide');
  sl.style.setProperty('--c', p.c);
  sl.style.opacity = 1;
  sl.querySelector('.sbk').src = SRC(p);
  sl.querySelector('.slab em').textContent = p.k;
  sl.querySelector('.slab b').textContent = p.n;

  sl.querySelector('.sbk').animate([
    {transform:'translateX(-50%) translateY(' + (first ? 22 : 12) + 'px) scale(.92)', opacity:0},
    {transform:'translateX(-50%) translateY(-8px) scale(1.03)', opacity:1, offset:.7},
    {transform:'translateX(-50%) translateY(0) scale(1)', opacity:1}
  ], {duration: ms(560), easing: OUT, fill:'both'});

  sl.querySelector('.spool').animate([
    {opacity:0,transform:'translateX(-50%) scale(.6)'},
    {opacity:.62,transform:'translateX(-50%) scale(1)'}
  ], {duration: ms(520), delay: ms(180), easing: SOFT, fill:'both'});

  sl.querySelector('.slab em').animate([
    {opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}
  ], {duration: ms(320), delay: ms(240), easing: SOFT, fill:'both'});

  sl.querySelector('.slab b').animate([
    {opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0)'}
  ], {duration: ms(420), delay: ms(300), easing: SOFT, fill:'both'});

  sl.querySelector('.slab i').animate([
    {width:'0px'},{width:'40px'}
  ], {duration: ms(460), delay: ms(400), easing: SOFT, fill:'both'});
}
function hideSlide(){
  var sl = document.getElementById('slide');
  sl.querySelector('.sbk').animate([
    {opacity:1,transform:'translateX(-50%) scale(1)'},
    {opacity:0,transform:'translateX(-50%) translateY(-14px) scale(.97)'}
  ], {duration: ms(260), easing: SOFT, fill:'both'});
  ['.spool','.slab em','.slab b','.slab i'].forEach(function(sel){
    sl.querySelector(sel).animate([{opacity:1},{opacity:0}],
      {duration: ms(200), easing: SOFT, fill:'both'});
  });
}

function slides(list){
  var seq = list || P.slice(0, 5);
  phase('Slides — one product, one name');
  var HOLD = ms(1500);
  seq.forEach(function(p, i){
    later(function(){ if (i) hideSlide(); }, i * HOLD - ms(260) < 0 ? 0 : i * HOLD - ms(260));
    later(function(){ showSlide(p, i === 0); }, i * HOLD);
  });
}

function playAll(){
  var end = flash(function(){ slides(); });
}
function toggleSlow(){
  K = K === 1 ? 3 : 1;
  var b = document.getElementById('slowBtn');
  b.classList.toggle('on', K !== 1);
  b.textContent = K === 1 ? 'Slow-mo' : 'Slow-mo 3x';
  playAll();
}
addEventListener('load', function(){ setTimeout(playAll, 350); });
</script>
</body></html>
